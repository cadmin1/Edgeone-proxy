<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际矿工 - 太空采矿小游戏</title>
<meta name="description" content="星际矿工是一款太空主题的采矿小游戏，点击挖掘、升级飞船、探索未知星球！">
<meta name="theme-color" content="#0a0a12">
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=20260725-2">
</head>
<body>
<div class="star-bg"></div>
<div class="star-field"></div>

<header class="g-header">
  <div class="g-header-inner">
    <div class="g-logo">
      <svg viewBox="0 0 36 36" aria-hidden="true">
        <polygon points="18,2 22,14 36,14 25,22 28,36 18,27 8,36 11,22 0,14 14,14" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
        <circle cx="18" cy="18" r="3" fill="#fbbf24"/>
      </svg>
      <span>星际矿工</span>
    </div>
    <div class="g-stats" id="statDisplay">
      <span>💰 <span id="moneyDisplay">0</span></span>
      <span>⛏️ Lv.<span id="levelDisplay">1</span></span>
    </div>
  </div>
</header>

<main>
  <div class="g-game-area">
    <div class="g-planet" id="planet">
      <div class="g-planet-glow"></div>
      <div class="g-planet-body">
        <div class="g-crust" id="crust"></div>
      </div>
      <div class="g-mine-btn" id="mineBtn">
        <svg viewBox="0 0 48 48"><path d="M24 4L4 24l20 20 20-20L24 4z" fill="none" stroke="#fbbf24" stroke-width="2"/><path d="M24 4v40M4 24h40" stroke="#fbbf24" stroke-width="1" opacity="0.5"/><circle cx="24" cy="24" r="8" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" stroke-width="1.5"/></svg>
      </div>
      <div class="g-particles" id="particles"></div>
    </div>

    <div class="g-card" id="upgradeCard">
      <div class="g-card-hd">
        <h2>🚀 飞船工坊</h2>
        <span class="g-badge" id="upgradeBadge">可升级</span>
      </div>

      <div class="g-upgrade-list">
        <div class="g-upgrade" id="upgradePick">
          <div class="g-upgrade-info">
            <span class="g-upgrade-name">⛏️ 钻头</span>
            <span class="g-upgrade-desc">每次挖掘收益 +1</span>
          </div>
          <div class="g-upgrade-right">
            <span class="g-upgrade-cost" id="costPick">💰 10</span>
            <button class="g-btn g-btn-sm" id="btnPick">升级</button>
          </div>
        </div>
        <div class="g-upgrade" id="upgradeSpeed">
          <div class="g-upgrade-info">
            <span class="g-upgrade-name">⚡ 引擎</span>
            <span class="g-upgrade-desc">挖掘间隔缩短</span>
          </div>
          <div class="g-upgrade-right">
            <span class="g-upgrade-cost" id="costSpeed">💰 20</span>
            <button class="g-btn g-btn-sm" id="btnSpeed">升级</button>
          </div>
        </div>
        <div class="g-upgrade" id="upgradeAuto">
          <div class="g-upgrade-info">
            <span class="g-upgrade-name">🤖 自动采矿</span>
            <span class="g-upgrade-desc">每 3 秒自动获得收益</span>
          </div>
          <div class="g-upgrade-right">
            <span class="g-upgrade-cost" id="costAuto">💰 50</span>
            <button class="g-btn g-btn-sm" id="btnAuto">解锁</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 密码验证卡片 -->
    <div class="g-card" id="pwCard" style="display:none;">
      <div class="g-card-hd">
        <h2>🔒 开发者入口</h2>
      </div>
      <div class="g-config-form">
        <div class="g-field">
          <label for="pwInput">请输入开发者密码</label>
          <input type="password" id="pwInput" placeholder="输入密码后回车" autocomplete="off">
        </div>
        <button class="g-btn g-btn-primary" id="pwSubmit">验证</button>
      </div>
    </div>

    <!-- 代理配置卡片（验证通过后显示） -->
    <div class="g-card" id="configCard" style="display:none;">
      <div class="g-card-hd">
        <h2>⚙️ 设置</h2>
      </div>
      <div class="g-config-form" id="configForm">
        <div class="g-field">
          <label for="cfgUrl">目标地址</label>
          <input type="url" id="cfgUrl" placeholder="https://example.com" spellcheck="false">
        </div>
        <div class="g-field">
          <label>代理模式</label>
          <div class="g-mode-group">
            <button class="g-mode-btn g-mode-active" data-type="proxy" id="modeStd">标准</button>
            <button class="g-mode-btn" data-type="advanced-proxy" id="modeAdv">高级</button>
          </div>
        </div>
        <button class="g-btn g-btn-primary" id="cfgGenerate">生成入口</button>
        <div class="g-result" id="cfgResult">
          <a href="#" id="cfgLink" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </div>

  <div class="g-toast" id="toast"></div>
</main>

<footer class="g-footer">
  <div class="g-footer-inner">
    <button class="g-footer-btn" id="showConfig" title="设置">⚙️</button>
    <button class="g-footer-btn" id="resetGame" title="重置">🔄</button>
  </div>
</footer>

<script>
(function(){
  const S = {
    money: parseInt(localStorage.getItem('gm_money') || '0'),
    pickLevel: parseInt(localStorage.getItem('gm_pick') || '1'),
    speedLevel: parseInt(localStorage.getItem('gm_speed') || '1'),
    autoLevel: parseInt(localStorage.getItem('gm_auto') || '0'),
    proxyType: 'proxy',
    authed: sessionStorage.getItem('gm_authed') === '1'
  };

  function save(){
    localStorage.setItem('gm_money', S.money);
    localStorage.setItem('gm_pick', S.pickLevel);
    localStorage.setItem('gm_speed', S.speedLevel);
    localStorage.setItem('gm_auto', S.autoLevel);
  }

  const $ = id => document.getElementById(id);
  const moneyD = $('moneyDisplay'), levelD = $('levelDisplay'), statD = $('statDisplay');
  const planet = $('planet'), mineBtn = $('mineBtn'), crust = $('crust');
  const particles = $('particles'), toast = $('toast');
  const costPick = $('costPick'), costSpeed = $('costSpeed'), costAuto = $('costAuto');
  const btnPick = $('btnPick'), btnSpeed = $('btnSpeed'), btnAuto = $('btnAuto');
  const badge = $('upgradeBadge');
  const cfgUrl = $('cfgUrl'), cfgResult = $('cfgResult'), cfgLink = $('cfgLink');
  const cfgForm = $('configForm'), configCard = $('configCard'), showConfig = $('showConfig');
  const pwCard = $('pwCard'), pwInput = $('pwInput'), pwSubmit = $('pwSubmit');
  const resetBtn = $('resetGame');

  let mineInterval = 600;
  let autoTimer = null;

  function calcPickCost(){ return 10 + (S.pickLevel - 1) * 8; }
  function calcSpeedCost(){ return 20 + (S.speedLevel - 1) * 15; }
  function calcAutoCost(){ return 50 + S.autoLevel * 40; }
  function pickPower(){ return S.pickLevel; }
  function speedMs(){ return Math.max(150, 600 - (S.speedLevel - 1) * 50); }

  function rand(min, max){ return Math.random() * (max - min) + min; }

  function spawnParticle(x, y){
    for(let i = 0; i < 6; i++){
      const el = document.createElement('div');
      el.className = 'g-particle';
      const size = rand(3, 7);
      el.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px;--dx:${rand(-60,60)};--dy:${rand(-80,-20)};background:${['#fbbf24','#f59e0b','#eab308','#fef08a'][Math.floor(rand(0,4))]}`;
      particles.appendChild(el);
      setTimeout(()=>el.remove(), 600);
    }
  }

  function doMine(e){
    const rect = planet.getBoundingClientRect();
    const cx = (e.clientX || e.touches?.[0]?.clientX || rect.left + rect.width/2) - rect.left;
    const cy = (e.clientY || e.touches?.[0]?.clientY || rect.top + rect.height/2) - rect.top;
    spawnParticle(cx, cy);

    S.money += pickPower();
    updateUI();
    save();

    crust.style.transform = 'scale(0.95)';
    setTimeout(()=>crust.style.transform = '', 100);

    clearInterval(autoTimer);
    if(S.autoLevel > 0){
      autoTimer = setInterval(() => {
        S.money += pickPower() * S.autoLevel;
        updateUI();
        save();
      }, 3000);
    }
  }

  function showToast(msg, dur){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>toast.classList.remove('show'), dur || 1200);
  }

  function updateUI(){
    moneyD.textContent = S.money;

    const cP = calcPickCost(), cS = calcSpeedCost(), cA = calcAutoCost();
    costPick.textContent = '💰 ' + cP;
    costSpeed.textContent = '💰 ' + cS;
    costAuto.textContent = S.autoLevel === 0 ? '💰 ' + cA : '已激活';

    const canPick = S.money >= cP;
    const canSpeed = S.money >= cS;
    const canAuto = S.autoLevel === 0 && S.money >= cA;

    btnPick.disabled = !canPick;
    btnSpeed.disabled = !canSpeed;
    btnAuto.disabled = !canAuto;
    btnAuto.textContent = S.autoLevel === 0 ? '解锁' : '已激活';

    if(canPick || canSpeed || (S.autoLevel === 0 && canAuto)){
      badge.textContent = '可升级';
      badge.style.borderColor = '#fbbf24';
      badge.style.color = '#fbbf24';
    } else {
      badge.textContent = '已满级';
      badge.style.borderColor = 'var(--border)';
      badge.style.color = 'var(--muted)';
    }

    mineInterval = speedMs();
    const level = S.pickLevel + S.speedLevel + S.autoLevel;
    levelD.textContent = level;
  }

  function handleUpgrade(type){
    let cost;
    if(type === 'pick'){
      cost = calcPickCost();
      if(S.money < cost) return showToast('💰 矿物不足！');
      S.money -= cost; S.pickLevel++;
      showToast('⛏️ 钻头升级！收益 +1');
    }
    else if(type === 'speed'){
      cost = calcSpeedCost();
      if(S.money < cost) return showToast('💰 矿物不足！');
      S.money -= cost; S.speedLevel++;
      showToast('⚡ 引擎升级！速度提升');
    }
    else if(type === 'auto'){
      if(S.autoLevel > 0) return;
      cost = calcAutoCost();
      if(S.money < cost) return showToast('💰 矿物不足！');
      S.money -= cost; S.autoLevel = 1;
      showToast('🤖 自动采矿已激活！');
      autoTimer = setInterval(() => {
        S.money += pickPower() * S.autoLevel;
        updateUI();
        save();
      }, 3000);
    }
    updateUI();
    save();
  }

  function generateLink(){
    const url = cfgUrl.value.trim();
    cfgResult.classList.remove('show');
    if(!url) return showToast('请输入地址！');
    try {
      new URL(url);
      const p = '/' + S.proxyType + '?url=' + encodeURIComponent(url);
      cfgLink.href = p;
      cfgLink.textContent = p;
      cfgResult.classList.add('show');
      showToast('✅ 入口已生成');
    } catch {
      showToast('❌ 地址无效，需包含 http:// 或 https://');
    }
  }

  function tryAuth(){
    const val = pwInput.value.trim();
    if(val === '1213'){
      S.authed = true;
      sessionStorage.setItem('gm_authed', '1');
      pwCard.style.display = 'none';
      configCard.style.display = 'block';
      showToast('✅ 验证通过');
    } else {
      showToast('❌ 密码错误');
    }
    pwInput.value = '';
  }

  function resetGame(){
    if(!confirm('确定重置所有游戏数据？')) return;
    S.money = 0; S.pickLevel = 1; S.speedLevel = 1; S.autoLevel = 0;
    S.authed = false; sessionStorage.removeItem('gm_authed');
    clearInterval(autoTimer); autoTimer = null;
    pwCard.style.display = 'none';
    configCard.style.display = 'none';
    save(); updateUI();
    showToast('🔄 已重置');
  }

  // Events
  mineBtn.addEventListener('click', doMine);
  mineBtn.addEventListener('touchstart', e => { e.preventDefault(); doMine(e); });

  btnPick.addEventListener('click', () => handleUpgrade('pick'));
  btnSpeed.addEventListener('click', () => handleUpgrade('speed'));
  btnAuto.addEventListener('click', () => handleUpgrade('auto'));

  document.querySelectorAll('.g-mode-btn').forEach(b => {
    b.addEventListener('click', function(){
      document.querySelectorAll('.g-mode-btn').forEach(x => x.classList.remove('g-mode-active'));
      this.classList.add('g-mode-active');
      S.proxyType = this.dataset.type;
    });
  });

  $('cfgGenerate').addEventListener('click', generateLink);

  // ⚙️ 按钮：首次需密码，验证后直接显示配置
  showConfig.addEventListener('click', () => {
    if(S.authed){
      const vis = configCard.style.display;
      configCard.style.display = vis === 'none' || vis === '' ? 'block' : 'none';
    } else {
      const vis = pwCard.style.display;
      pwCard.style.display = vis === 'none' || vis === '' ? 'block' : 'none';
      if(pwCard.style.display === 'block') pwInput.focus();
    }
  });

  pwSubmit.addEventListener('click', tryAuth);
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') tryAuth(); });

  resetBtn.addEventListener('click', resetGame);

  // Load auto if active
  if(S.autoLevel > 0){
    autoTimer = setInterval(() => {
      S.money += pickPower() * S.autoLevel;
      updateUI();
      save();
    }, 3000);
  }

  // 如果已验证过，下次点⚙️直接显示配置
  if(S.authed){
    // 不自动显示，等用户主动点⚙️
  }

  updateUI();

  // Star field
  (function(){
    const container = document.querySelector('.star-field');
    for(let i = 0; i < 80; i++){
      const s = document.createElement('div');
      s.className = 'star';
      s.style.cssText = `left:${rand(0,100)}%;top:${rand(0,100)}%;width:${rand(1,3)}px;height:${rand(1,3)}px;animation-delay:${rand(0,5)}s;animation-duration:${rand(2,5)}s`;
      container.appendChild(s);
    }
  })();
})();
</script>
</body>
</html>
